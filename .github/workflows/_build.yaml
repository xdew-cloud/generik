name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish (semver, from .version)
        required: true
        type: string
    outputs:
      build_success:
        description: "true once the chart is pushed"
        value: ${{ jobs.build.outputs.build_success }}

permissions: {}

jobs:
  build:
    name: Package and push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      build_success: ${{ steps.done.outputs.build_success }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Log in to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Package and push the chart
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid version"; exit 1; }
          OWNER=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm package . --version "$VERSION" --destination dist
          helm push "dist/generik-${VERSION}.tgz" "oci://ghcr.io/${OWNER}"

      - name: Mark success
        id: done
        run: echo "build_success=true" >> "$GITHUB_OUTPUT"
