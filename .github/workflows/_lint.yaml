name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Lint and render every test app
        run: |
          set -euo pipefail
          for values in tests/apps/*.values.yaml; do
            helm lint . -f "$values"
            helm template ci . -f "$values" > /dev/null
          done

      - name: Check the version file
        run: |
          set -euo pipefail
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' .version
