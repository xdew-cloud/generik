apiVersion: v1
kind: Service
metadata:
  name: {{ include "generik.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generik.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "generik.name" . }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
