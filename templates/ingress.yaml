{{- $name := include "generik.name" . }}
{{- $hosts := include "generik.sharedHosts" . | fromJsonArray }}
{{- /* The app is the first entry. A path names the entry that serves it (by its `name`), or any other Service as written. */ -}}
{{- $entries := include "generik.deployments" . | fromJsonArray }}
{{- $main := index $entries 0 }}
{{- $objects := dict }}
{{- range $entries }}{{- if .name }}{{- $_ := set $objects .name .object }}{{- end }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generik.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ $name }}-tls
  rules:
    {{- range $i, $host := $hosts }}
    - host: {{ $host }}
      http:
        paths:
          {{- if eq $i 0 }}
          {{- range $.Values.ingress.extraPaths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ get $objects .service | default .service }}
                port:
                  number: {{ .port }}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $main.object }}
                port:
                  name: {{ $main.portName }}
    {{- end }}
