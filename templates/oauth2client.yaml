{{- if .Values.oauth2.enabled }}
apiVersion: hydra.ory.sh/v1alpha1
kind: OAuth2Client
metadata:
  name: {{ include "generik.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generik.labels" . | nindent 4 }}
spec:
  clientName: {{ .Values.oauth2.clientName | quote }}
  grantTypes:
    {{- toYaml .Values.oauth2.grantTypes | nindent 4 }}
  {{- with .Values.oauth2.responseTypes }}
  responseTypes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.oauth2.scope }}
  scope: {{ . | quote }}
  {{- end }}
  {{- if .Values.oauth2.audience }}
  audience:
    - {{ .Values.oauth2.audience | quote }}
  {{- end }}
  {{- with .Values.oauth2.redirectPaths }}
  redirectUris:
    {{- range . }}
    - https://{{ $.Values.ingress.host }}{{ . }}
    {{- end }}
  {{- end }}
  tokenEndpointAuthMethod: {{ .Values.oauth2.tokenEndpointAuthMethod }}
  secretName: {{ include "generik.name" . }}-client-secrets
  skipConsent: true
{{- end }}
