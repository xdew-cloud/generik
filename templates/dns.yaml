{{- if .Values.dns.enabled }}
{{- range $i, $host := (include "generik.hosts" . | fromJsonArray) }}
{{- if $i }}
---
{{- end }}
apiVersion: cloudflare-operator.io/v1
kind: DNSRecord
metadata:
  name: {{ $host | replace "." "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "generik.labels" $ | nindent 4 }}
spec:
  name: {{ $host }}
  type: CNAME
  content: {{ $.Values.dns.target }}
  proxied: {{ $.Values.dns.proxied }}
{{- end }}
{{- end }}
