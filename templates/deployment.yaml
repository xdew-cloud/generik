{{- $v := .Values }}
{{- $name := include "generik.name" . }}
{{- $env := $v.env | default list }}
{{- if $v.oauth2.enabled }}
{{- $secret := printf "%s-client-secrets" $name }}
{{- $env = append $env (dict "name" $v.oauth2.clientIdEnv "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" "CLIENT_ID"))) }}
{{- $env = append $env (dict "name" $v.oauth2.clientSecretEnv "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" "CLIENT_SECRET"))) }}
{{- end }}
{{- $w := dict "image" $v.image "replicas" $v.replicas "port" $v.port "portName" "http" "strategy" $v.strategy "probes" $v.probes "resources" $v.resources "imagePullSecret" $v.imagePullSecret "podSecurityContext" $v.podSecurityContext "volumes" $v.volumes "volumeMounts" $v.volumeMounts "command" $v.command "args" $v.args }}
{{- /* With components, the app is the "web" one, so that its Service does not select their pods. */ -}}
{{- $component := ternary "web" "" (not (empty $v.components)) }}
{{ include "generik.deployment" (dict "root" . "name" $name "container" $name "component" $component "selectByComponent" false "serviceAccount" $v.serviceAccount.create "secrets" $v.secrets "env" $env "w" $w) }}
