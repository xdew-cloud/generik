# Object names (Deployment, Service, Ingress, ...). Defaults to the release name.
name: ""

image:
  repository: ""
  # Required: the tag is explicit, there is no chart appVersion to fall back on.
  tag: ""
  pullPolicy: Always

# Name of an existing dockerconfigjson Secret in the release namespace. Empty: no imagePullSecrets (a public image).
imagePullSecret: pull-secret

replicas: 1

# Container port, named "http".
port: 3000

service:
  # The port of the Service, which targets the container's "http" port.
  port: 80

# type: RollingUpdate (default) or Recreate (an app that holds a ReadWriteOnce volume). maxUnavailable and maxSurge
# are the settings of a rolling update; empty keeps the Kubernetes defaults.
strategy: {}

# What the container runs instead of its image's entrypoint, and its arguments. Empty keeps the image's.
command: []
args: []

# Pod security context (fsGroup...), and volumes with their mounts, in Kubernetes syntax. The volume's objects
# (a PersistentVolumeClaim) are files next to the App, not part of this chart.
podSecurityContext: {}
volumes: []
volumeMounts: []

# TCP probes on the "http" port. Every key is passed as is; set a key to null to remove a default.
probes:
  readiness:
    initialDelaySeconds: 10
    timeoutSeconds: 5
  liveness:
    initialDelaySeconds: 15
    timeoutSeconds: 5

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 256Mi

# Environment variables, in Kubernetes syntax (name + value, or name + valueFrom).
# CLIENT_ID and CLIENT_SECRET are appended when oauth2.enabled is true.
env: []

# true: the container reads <name>-secrets (envFrom). The SopsSecret itself is not part of this chart:
# it is a file next to the App.
secrets: false

serviceAccount:
  create: false

rbac:
  # Rules of a ClusterRole bound to the ServiceAccount (needs serviceAccount.create).
  clusterRules: []

ingress:
  host: ""
  # More hosts for the same Service. A string joins the Ingress of the app: a TLS host, a rule and a DNS record.
  # An object {host, name, middleware} gets its own Ingress, certificate and Traefik Middleware, for a host that
  # rewrites the path (middleware is the spec of the Middleware as is):
  #   - {host: webhook.example.org, name: webhook, middleware: {addPrefix: {prefix: /webhook}}}
  #   - {host: old.example.org, middleware: {replacePathRegex: {regex: ^/v1/(.*), replacement: /$1}}}
  extraHosts: []
  className: traefik
  clusterIssuer: xdew-cloudflare
  # Paths of the main host routed to another Service before "/": [{path, service, port}].
  extraPaths: []

# Cloudflare DNS record (cloudflare-operator) for each host.
dns:
  enabled: true
  target: origin.xdew.cloud
  proxied: true

# Ory Hydra OAuth2 client; its credentials land in <name>-client-secrets.
oauth2:
  enabled: false
  clientName: ""
  audience: ""
  # Empty keeps the scope out of the client.
  scope: "openid email profile groups offline_access"
  # A web login (the default), or [client_credentials] for a service that calls other services: then set
  # responseTypes and redirectPaths to [].
  grantTypes: [authorization_code, refresh_token]
  responseTypes: [code]
  tokenEndpointAuthMethod: client_secret_basic
  # The environment variables of the container that carry the id and the secret of the client.
  clientIdEnv: CLIENT_ID
  clientSecretEnv: CLIENT_SECRET
  # Redirect URIs are https://<ingress.host><path>.
  redirectPaths:
    - /api/auth/callback/hydra

# More Deployments for the same app, each with its own Service (a worker, a cache). A component is named
# <name>-<component> and is reached at http://<name>-<component>:<service.port>. Every key is optional: the image
# is the app's unless it says otherwise, `env` and the rest are the component's own, and `secrets: true` reads the
# app's <name>-secrets. When there are components, the app's pods carry app.kubernetes.io/component: web.
#
#   components:
#     collaboration:
#       replicas: 1
#       port: 3000
#       env: [{name: SERVICES, value: collaboration}]
#       secrets: true
#     redis:
#       image: {repository: redis, tag: 7-alpine, pullPolicy: IfNotPresent}
#       imagePullSecret: ""
#       port: 6379
#       portName: redis
#       service: {port: 6379}
#       args: [--save, "60", "1"]
#       strategy: {type: Recreate}
#       volumes: [{name: data, persistentVolumeClaim: {claimName: docs-redis}}]
#       volumeMounts: [{name: data, mountPath: /data}]
#       probes: {readiness: {initialDelaySeconds: 5}, liveness: {initialDelaySeconds: 15}}
#
# Keys of a component: image {repository, tag, pullPolicy}, imagePullSecret, replicas, port, portName,
# service {enabled, port}, strategy, probes, resources, env, secrets, command, args, podSecurityContext,
# volumes, volumeMounts.
components: {}

