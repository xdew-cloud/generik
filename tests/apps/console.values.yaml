name: console
image: {repository: ghcr.io/xdew-cloud/console, tag: 4.4.3}
ingress: {host: console.xdew.cloud}
secrets: true
serviceAccount: {create: true}
rbac:
  clusterRules:
    # Pod listing for the application detail page and the node detail page.
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
    # Disk read for the storage pages, read directly from the CRD instead of the backend API.
    - apiGroups: ["storage.xdew.cloud"]
      resources: ["disks"]
      verbs: ["get", "list", "watch"]
env:
  - {name: API_URL, value: "http://api:3000"}
  - {name: API_AUDIENCE, value: "api"}
  - {name: AUTH_URL, value: "https://console.xdew.cloud"}
  - {name: IDENTITY_ISSUER, value: "https://auth.xdew.cloud"}
oauth2:
  enabled: true
  clientName: Console
  audience: api
  redirectPaths:
    - /api/auth/callback/ory-hydra
    - /api/auth/callback/hydra
