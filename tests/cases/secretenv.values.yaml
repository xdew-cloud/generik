# Settings read from another Secret (optional keys), and rights on a resource and on its status.
name: bridge
ingress: {host: bridge.example.org}
serviceAccount: {create: true}
rbac:
  clusterRules:
    - {apiGroups: [example.org], resources: [versions], verbs: [get, list, create, delete]}
    - {apiGroups: [example.org], resources: [versions/status], verbs: [get, patch]}
deployments:
  - image: {repository: ghcr.io/example/bridge, tag: 1.0.0}
    env:
      - {name: MODE, value: production}
      - name: APP_ID
        valueFrom:
          secretKeyRef: {name: bridge-app, key: appId, optional: true}
      - name: APP_KEY
        valueFrom:
          secretKeyRef: {name: bridge-app, key: privateKey, optional: true}
      - {name: RESYNC_SECONDS, value: "3600"}
